<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سوق ابن عقيل - لوحة الصدارة</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf7ef;--card:#fff;--ink:#2b2414;--mut:#7a6c4a;--gold:#c4a118;--brn:#6b5420;--line:#e8dfc6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a160c;--card:#262012;--ink:#f3ead0;--mut:#b5a67a;--line:#3a3220}}
:root[data-theme="dark"]{--bg:#1a160c;--card:#262012;--ink:#f3ead0;--mut:#b5a67a;--line:#3a3220}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
header{text-align:center}header img{width:150px;max-width:50%;background:#fff;border-radius:16px;padding:8px}
h1{font-size:22px;margin:8px 0 2px;color:var(--gold)}.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.tabs{display:flex;gap:8px;justify-content:center;margin:10px 0}.tabs button{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit}.tabs button.on{background:var(--brn);color:#fff;border-color:var(--brn)}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.rk{width:34px;height:34px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:700}
.r1 .rk{background:#f2c94c}.r2 .rk{background:#cfd4da;color:#222}.r3 .rk{background:#d9a066;color:#222}
.nm{flex:1;font-weight:600}.st{font-size:12px;color:var(--mut);font-weight:400}.pt{font-weight:700;color:var(--gold);font-size:18px}
.empty{text-align:center;color:var(--mut);padding:30px}
#admin{background:var(--card);border:1px dashed var(--gold);border-radius:14px;padding:12px;margin-top:14px}
#admin input,#admin select{width:100%;padding:9px;margin:4px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px}#admin button{width:100%;padding:11px;margin-top:6px;border:0;border-radius:10px;background:var(--gold);color:#222;font:inherit;font-weight:700}
</style></head><body>

<div id="board"></div><div id="admin"></div>
<script type="application/json" id="d">[]</script>
<script>
let rows=JSON.parse(document.getElementById('d').textContent),flt='';
const B=document.getElementById('board');
function render(){B.innerHTML='';const m={};
rows.forEach(r=>{const k=r[1];m[k]=m[k]||{n:k,s:r[2],t:0};m[k].t+=r[3]+r[4]+r[5]+r[6];m[k].s=r[2]});
const l=Object.values(m).sort((a,b)=>b.t-a.t);
if(!l.length){B.innerHTML='<div class="empty">لا توجد نقاط مسجّلة بعد</div>';return}
l.forEach((x,i)=>{const e=document.createElement('div');e.className='row r'+(i+1);
const a=document.createElement('div');a.className='rk';a.textContent=i+1;
const n=document.createElement('div');n.className='nm';n.textContent=x.n;

const p=document.createElement('div');p.className='pt';p.textContent=x.t;e.append(a,n,p);B.appendChild(e)})}
render();
(async()=>{try{
const u=await claude.use('user');if(!u||!u.canEdit())return;
const art=await claude.use('artifact');if(!art)return;
const A=document.getElementById('admin');
A.innerHTML='<b>إدخال درجات اليوم (للمعلم فقط)</b><input id="nm" placeholder="اسم الطالب"><div class="g"><input id="a" type="number" min="0" max="10" placeholder="الحضور"><input id="b" type="number" min="0" max="10" placeholder="الانضباط"><input id="c" type="number" min="0" max="10" placeholder="الحفظ"><input id="e" type="number" min="0" max="10" placeholder="المراجعة"></div><button id="go">حفظ ونشر</button>';
document.getElementById('go').onclick=async()=>{
const v=id=>Math.max(0,Math.min(10,parseInt(document.getElementById(id).value)||0));
const nm=document.getElementById('nm').value.trim();if(!nm)return;
rows.push([new Date().toISOString().slice(0,10),nm,'',v('a'),v('b'),v('c'),v('e')]);
const c=document.documentElement.cloneNode(true);
c.querySelector('#d').textContent=JSON.stringify(rows);c.querySelector('#board').innerHTML='';c.querySelector('#admin').innerHTML='';
try{await art.publish('<!DOCTYPE html>\n'+c.outerHTML)}catch(x){render()}};
}catch(x){}})();
</script></body></html>
