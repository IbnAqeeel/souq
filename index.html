<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سوق ابن عقيل</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#3d3012;--olive:#6b5520;--gold:#c4a115;--gold-soft:#f4ebc2;--paper:#fffdf6;--line:#e6dcb4;--muted:#8a7a4c;--ok:#2e7d4f;--bad:#b3261e}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Tajawal',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;padding:0 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{text-align:center;padding:28px 16px 18px;border-bottom:4px double var(--gold);background:linear-gradient(#fff,var(--paper))}
.logo{width:140px;height:140px;margin:0 auto 6px;display:grid;place-items:center}
.logo img{max-width:100%;max-height:100%;object-fit:contain}
.logo-fallback{width:100%;height:100%;border:2px dashed var(--gold);border-radius:12px;display:grid;place-items:center;font-family:'Reem Kufi',serif;color:var(--olive);font-size:18px;padding:8px}
h1{font-family:'Reem Kufi',serif;font-size:clamp(30px,8vw,44px);color:var(--olive);font-weight:700;line-height:1.3}
.sub{color:var(--muted);margin-top:2px}
#lock{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);background:#fff;font-size:20px;cursor:pointer;z-index:20}
#lock.on{background:var(--gold-soft)}
main{max-width:680px;margin:0 auto;padding:16px}
#board{list-style:none;padding:0;display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:#fff;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;text-align:right}
.row:hover{border-color:var(--gold)}
.rank{min-width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);font-family:'Reem Kufi',serif;font-weight:700;color:var(--olive)}
.r1 .rank{background:var(--gold);color:#fff}
.r1{border-color:var(--gold);background:linear-gradient(to left,#fff,var(--gold-soft))}
.r2 .rank,.r3 .rank{background:var(--olive);color:#fff}
.nm{flex:1;font-weight:700;font-size:17px}
.pts{font-family:'Reem Kufi',serif;font-size:22px;color:var(--olive);font-weight:700}
.pts small{font-family:'Tajawal';font-size:12px;color:var(--muted);margin-inline-start:3px}
.empty{text-align:center;color:var(--muted);padding:30px 0}
dialog{border:none;border-radius:18px;padding:0;width:min(94vw,520px);max-height:88vh;background:var(--paper);color:var(--ink);box-shadow:0 20px 60px rgba(61,48,18,.35)}
dialog::backdrop{background:rgba(61,48,18,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper)}
.dh h2{font-family:'Reem Kufi',serif;color:var(--olive);font-size:22px}
.x{border:none;background:none;font-size:26px;cursor:pointer;line-height:1;padding:4px 8px}
.db{padding:14px 18px 20px;overflow:auto;max-height:calc(88vh - 70px)}
.sum{display:flex;gap:8px;margin-bottom:12px}
.sum div{flex:1;background:var(--gold-soft);border-radius:12px;padding:10px;text-align:center}
.sum b{display:block;font-family:'Reem Kufi',serif;font-size:24px;color:var(--olive)}
.day{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.day .top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:13px;color:var(--muted)}
.cells b{display:block;font-size:18px;color:var(--ink)}
fieldset{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;background:#fff}
legend{padding:0 6px;font-weight:700;color:var(--olive)}
label{display:block;font-size:14px;margin:8px 0 4px;color:var(--muted)}
input,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;margin-top:12px;padding:12px;border:none;border-radius:10px;background:var(--olive);color:#fff;font-weight:700;cursor:pointer}
.btn.alt{background:var(--gold);color:var(--ink)}
.msg{margin-top:8px;font-size:14px;min-height:20px}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
#status{text-align:center;font-size:13px;color:var(--muted);padding:6px}
@media (prefers-reduced-motion:no-preference){.row{transition:border-color .15s}}
</style>
</head>
<body>
<button id="lock" aria-label="لوحة الإدارة" title="الإدارة">🔒</button>
<header>
  <div class="logo">
    <img src="logo.png.JPEG" alt="شعار مدرسة ابن عقيل لتحفيظ القرآن الكريم"
         onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'logo-fallback',textContent:'ضع الشعار هنا'}))">
  </div>
  <h1>سوق ابن عقيل</h1>
  <p class="sub">لوحة صدارة حلقة ابن عقيل لتحفيظ القرآن الكريم</p>
</header>
<main>
  <ul id="board"></ul>
  <p id="status">جارٍ التحميل…</p>
</main>
<dialog id="dStudent">
  <div class="dh"><h2 id="sName"></h2><button class="x" data-close aria-label="إغلاق">×</button></div>
  <div class="db" id="sBody"></div>
</dialog>
<dialog id="dAdmin">
  <div class="dh"><h2>لوحة الإدارة</h2><button class="x" data-close aria-label="إغلاق">×</button></div>
  <div class="db">
    <fieldset>
      <legend>إضافة درجات يومية</legend>
      <label for="aStu">الطالب</label><select id="aStu"></select>
      <label for="aDate">التاريخ</label><input type="date" id="aDate">
      <div class="g4">
        <div><label for="sA">الحضور (من 10)</label><input type="number" id="sA" min="0" max="10" inputmode="numeric" value="10"></div>
        <div><label for="sD">الانضباط (من 10)</label><input type="number" id="sD" min="0" max="10" inputmode="numeric" value="10"></div>
        <div><label for="sH">الحفظ (من 10)</label><input type="number" id="sH" min="0" max="10" inputmode="numeric" value="0"></div>
        <div><label for="sR">المراجعة (من 10)</label><input type="number" id="sR" min="0" max="10" inputmode="numeric" value="0"></div>
      </div>
      <button class="btn" id="saveScore">حفظ الدرجات</button>
      <p class="msg" id="m1" role="status"></p>
    </fieldset>
    <fieldset>
      <legend>إضافة طالب جديد</legend>
      <label for="nName">اسم الطالب</label><input id="nName" autocomplete="off">
      <button class="btn alt" id="addStu">إضافة الطالب</button>
      <p class="msg" id="m2" role="status"></p>
    </fieldset>
  </div>
</dialog>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCT0Mg5cy1-EYBy1lILdcSqZ7EuyIirGJg",
  authDomain: "sooq-ibn-aqeel.firebaseapp.com",
  databaseURL: "https://sooq-ibn-aqeel-default-rtdb.firebaseio.com",
  projectId: "sooq-ibn-aqeel",
  storageBucket: "sooq-ibn-aqeel.firebasestorage.app",
  messagingSenderId: "646801574631",
  appId: "1:646801574631:web:1d358b7059333d79397042",
  measurementId: "G-RFDZD8WSS7"
};
const ADMIN_CODE = "1029";
const FIELDS = [["a","الحضور"],["d","الانضباط"],["h","الحفظ"],["r","المراجعة"]];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = d => FIELDS.reduce((t,[k]) => t + (+d[k]||0), 0);
let students = {}, scores = {}, isAdmin = false, openId = null;
try {
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  db.ref("students").on("value", s => { students = s.val() || {}; render(); }, fail);
  db.ref("scores").on("value", s => { scores = s.val() || {}; $("status").textContent = ""; render(); }, fail);
  window._db = db;
} catch (e) { fail(e); }
function fail(e){ $("status").textContent = "تعذّر الاتصال بقاعدة البيانات — تحقق من إعدادات Firebase."; console.error(e); }
function totalOf(id){ return Object.values(scores[id] || {}).reduce((t,d) => t + sum(d), 0); }
function rows(){
  return Object.entries(students)
    .map(([id,s]) => ({id, name:s.name, total:totalOf(id)}))
    .sort((x,y) => y.total - x.total || x.name.localeCompare(y.name,"ar"));
}
function render(){
  const list = rows();
  $("board").innerHTML = list.length ? list.map((s,i) =>
    `<li><button class="row ${i===0?'r1':''} ${i<3?'r'+(i+1):''}" data-id="${esc(s.id)}">
      <span class="rank">${i+1}</span>
      <span class="nm">${esc(s.name)}</span>
      <span class="pts">${s.total}<small>نقطة</small></span></button></li>`).join("")
    : `<li class="empty">لا يوجد طلاب بعد.</li>`;
  fillSelect();
  if (openId && $("dStudent").open) showStudent(openId);
}
function showStudent(id){
  const s = students[id]; if (!s) return;
  openId = id;
  const days = Object.entries(scores[id] || {}).sort((a,b) => b[0].localeCompare(a[0]));
  $("sName").textContent = s.name;
  $("sBody").innerHTML =
    `<div class="sum"><div><b>${totalOf(id)}</b>إجمالي النقاط</div><div><b>${days.length}</b>أيام مسجلة</div></div>` +
    (days.length ? days.map(([date,d]) =>
      `<div class="day"><div class="top"><span>${esc(date)}</span><span>${sum(d)} / 40</span></div>
       <div class="cells">${FIELDS.map(([k,l]) => `<div><b>${+(d[k] ?? 0)}</b>${l}</div>`).join("")}</div></div>`).join("")
     : `<p class="empty">لا توجد درجات مسجلة بعد.</p>`);
  if (!$("dStudent").open) $("dStudent").showModal();
}
function fillSelect(){
  const sel = $("aStu"), cur = sel.value;
  sel.innerHTML = Object.entries(students).sort((a,b) => a[1].name.localeCompare(b[1].name,"ar"))
    .map(([id,s]) => `<option value="${esc(id)}">${esc(s.name)}</option>`).join("");
  if (cur) sel.value = cur;
}
$("board").addEventListener("click", e => { const b = e.target.closest(".row"); if (b) showStudent(b.dataset.id); });
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => { b.closest("dialog").close(); openId = null; });
document.querySelectorAll("dialog").forEach(d => d.addEventListener("click", e => { if (e.target === d) { d.close(); openId = null; } }));
$("lock").onclick = () => {
  if (!isAdmin) {
    const code = prompt("أدخل رمز الدخول:");
    if (code === null) return;
    if (code !== ADMIN_CODE) { alert("الرمز غير صحيح"); return; }
    isAdmin = true; $("lock").textContent = "🔓"; $("lock").classList.add("on");
    $("aDate").value = new Date().toISOString().slice(0,10);
  }
  $("dAdmin").showModal();
};
function say(id, text, ok){ const m = $(id); m.textContent = text; m.className = "msg " + (ok ? "ok" : "bad"); }
$("saveScore").onclick = async () => {
  const id = $("aStu").value, date = $("aDate").value;
  if (!id || !date) return say("m1","اختر الطالب والتاريخ.",false);
  const v = {};
  for (const [k] of FIELDS) {
    const n = Number($({a:"sA",d:"sD",h:"sH",r:"sR"}[k]).value);
    if (!Number.isInteger(n) || n < 0 || n > 10) return say("m1","كل درجة يجب أن تكون من 0 إلى 10.",false);
    v[k] = n;
  }
  try {
    await _db.ref(`scores/${id}/${date}`).set(v);
    say("m1",`تم حفظ ${sum(v)} نقطة لـ ${students[id].name}.`,true);
  } catch (e) { say("m1","تعذّر الحفظ — راجع قواعد Firebase.",false); }
};
$("addStu").onclick = async () => {
  const name = $("nName").value.trim();
  if (!name) return say("m2","اكتب اسم الطالب.",false);
  try {
    await _db.ref("students").push({name});
    $("nName").value = ""; say("m2","تمت إضافة الطالب.",true);
  } catch (e) { say("m2","تعذّر الإضافة — راجع قواعد Firebase.",false); }
};
</script>
</body>
</html>
